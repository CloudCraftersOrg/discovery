# The registry of every collector name used in answer-key.yaml (P2-05).
# evidence_for is computed from the answer key, not hand-maintained - see
# the generator this was authored with. Re-derive rather than hand-edit if
# the answer key changes.
collectors:
  all regional collectors:
    domain: infra
    resource_types:
    - '*'
    cadence: on_delivery
    regional: true
    evidence_for:
    - AK-COV-01
    note: 'Not a single collector: every regional collector''s coverage record, collectively, is this
      item''s evidence.'
